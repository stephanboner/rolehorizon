name: Verify RoleHorizon
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-repository.mjs
      - run: python3 -m py_compile worker/app.py worker/job_source.py
